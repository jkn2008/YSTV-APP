name: Build‑Java‑Fixed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_java:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup‑java@v4
        with:
          java‑version: '11'
          distribution: 'temurin'

      - name: Install Android SDK cmdline‑tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm -f commandlinetools-linux-9477386_latest.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: |
          sdkmanager --licenses <<< $'y\ny\ny\ny\ny'

      - name: Install SDK Platform, Build‑Tools, NDK
        run: |
          sdkmanager "platforms;android‑28" "build‑tools;33.0.2" "ndk;25.2.9519653"

      - name: Grant execute permission gradlew
        run: chmod +x gradlew

      # 同时编译TV(app) 和手机版(app_mobile) Release包
      - name: Compile Release APK
        run: ./gradlew app:assembleRelease app_mobile:assembleRelease

      - name: Upload TV(盒子) APK
        uses: actions/upload‑artifact@v4
        with:
          name: Yinghe‑TV‑Release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Mobile(手机) APK
        uses: actions/upload‑artifact@v4
        with:
          name: Yinghe‑Mobile‑Release
          path: app_mobile/build/outputs/apk/release/*.apk
