name: Build‑Java‑Only
on:
  workflow_dispatch: # 手动运行
  push:
    branches: [ main ]

jobs:
  build_java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android-sdk@v2
        with:
          api-levels: 28
          build-tools: "33.0.2"
          ndk: "25.2.9519653"

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Compile Java Release
        run: ./gradlew assembleJavaRelease

      - name: Upload Java APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Java-Release
          path: app/build/outputs/apk/java/release/*.apk
